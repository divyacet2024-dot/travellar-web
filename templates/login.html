{% extends "base.html" %}

{% block title %}Login - AI Travel Planner{% endblock %}

{% block extra_css %}
<style>
    .auth-page {
        min-height: calc(100vh - 200px);
        display: flex;
        align-items: center;
        background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1920') center/cover;
        position: relative;
    }
    
    .auth-page::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(26, 26, 46, 0.9), rgba(102, 126, 234, 0.5));
    }
    
    .auth-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 25px;
        box-shadow: 0 25px 80px rgba(0,0,0,0.4);
        overflow: hidden;
        position: relative;
        z-index: 1;
    }
    
    .auth-image {
        background: url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=800') center/cover;
        min-height: 500px;
        position: relative;
    }
    
    .auth-image::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.8), rgba(118, 75, 162, 0.6));
    }
    
    .auth-form {
        padding: 3rem;
    }
    
    .auth-form h2 {
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1.5rem;
    }
    
    .btn-auth {
        border-radius: 12px;
        padding: 14px 35px;
        font-weight: 600;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        transition: all 0.3s ease;
    }
    
    .btn-auth:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    
    .social-login {
        display: flex;
        gap: 15px;
        margin-top: 1.5rem;
    }
    
    .social-btn {
        flex: 1;
        border-radius: 12px;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        transition: all 0.3s ease;
    }
    
    .social-btn.google {
        background: #fff;
        border: 2px solid #e0e0e0;
        color: #333;
    }
    
    .social-btn.google:hover {
        border-color: #dc3545;
        color: #dc3545;
    }
    
    .social-btn.facebook {
        background: #1877f2;
        border: none;
        color: white;
    }
    
    .social-btn.facebook:hover {
        background: #1565c0;
    }
    
    .forgot-link {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-decoration: none;
        font-weight: 500;
    }
    
    .forgot-link:hover {
        text-decoration: underline;
    }
    
    .register-link {
        color: #667eea;
        font-weight: 600;
    }
    
    .register-link:hover {
        color: #764ba2;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-page py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="auth-card">
                    <div class="row g-0">
                        <div class="col-lg-6">
                            <div class="auth-image"></div>
                        </div>
                        <div class="col-lg-6">
                            <div class="auth-form">
                                <div class="text-center mb-4">
                                    <h2 class="fw-bold">Welcome Back</h2>
                                    <p class="text-muted">Login to continue your travel journey</p>
                                </div>
                                
                                <form method="POST" action="{{ url_for('login') }}">
                                    <div class="mb-3">
                                        <label class="form-label">Email Address</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light">
                                                <i class="fas fa-envelope"></i>
                                            </span>
                                            <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                                        </div>
                                    </div>
                                    
                                    <div class="mb-4">
                                        <label class="form-label">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light">
                                                <i class="fas fa-lock"></i>
                                            </span>
                                            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                                        </div>
                                        <div class="text-end mt-2">
                                            <a href="#" class="forgot-link small">Forgot password?</a>
                                        </div>
                                    </div>
                                    
                                    <button type="submit" class="btn btn-primary w-100 btn-auth">
                                        <i class="fas fa-sign-in-alt me-2"></i>Login
                                    </button>
                                </form>
                                
                                <div class="text-center mt-4">
                                    <p class="text-muted">Don't have an account? 
                                        <a href="{{ url_for('register') }}" class="text-primary fw-bold">Register here</a>
                                    </p>
                                </div>
                                
                                <div class="text-center my-4">
                                    <span class="text-muted">Or continue with</span>
                                </div>
                                
                                <div class="social-login">
                                    <button class="btn btn-outline-secondary social-btn">
                                        <i class="fab fa-google"></i>
                                    </button>
                                    <button class="btn btn-outline-secondary social-btn">
                                        <i class="fab fa-facebook-f"></i>
                                    </button>
                                    <button class="btn btn-outline-secondary social-btn">
                                        <i class="fab fa-twitter"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
